# Produce a weekly storage and execution report for BikeWatch.
# The report is saved as a downloadable workflow artifact.

name: BikeWatch weekly usage

on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bikewatch-weekly-usage
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    env:
      PYTHONPATH: src:scripts
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        timeout-minutes: 3
        run: |
          python -m pip install -r requirements-ci.lock
          python -m pip check

      - name: Generate weekly report
        timeout-minutes: 3
        env:
          DBT_HOST: ${{ vars.DBT_HOST }}
          DBT_PORT: ${{ vars.DBT_PORT || '5432' }}
          DBT_DBNAME: ${{ vars.DBT_DBNAME || 'bikewatch' }}
          DBT_ENV_SECRET_PASSWORD: ${{ secrets.DBT_ENV_SECRET_PASSWORD }}
        run: |
          python scripts/maintenance.py report \
            --output artifacts/weekly-usage-report.json

      - name: Save weekly report
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: bikewatch-weekly-usage-${{ github.run_id }}
          path: artifacts/weekly-usage-report.json
          retention-days: 30
          if-no-files-found: error