name: BikeWatch collection

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bikewatch-production
  cancel-in-progress: false

jobs:
  collect-and-publish:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (
        github.event_name == 'workflow_dispatch'
        || vars.BIKEWATCH_SCHEDULE_ENABLED == 'true'
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 14

    env:
      APP_ENV: production
      APP_TIMEZONE: America/New_York
      COLLECTION_INTERVAL_MINUTES: "15"
      TRACKED_STATION_COUNT: "20"
      GBFS_DISCOVERY_URL: https://gbfs.citibikenyc.com/gbfs/gbfs.json
      PYTHONPATH: src:scripts
      PYTHONUNBUFFERED: "1"

      # PostgreSQL applies these to new libpq connections.
      PGOPTIONS: "-c statement_timeout=120000 -c lock_timeout=15000"

    steps:
      - name: Check out production branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        timeout-minutes: 3
        run: |
          python -m pip install -r requirements-ci.lock
          python -m pip check

      - name: Validate station and coverage configuration
        timeout-minutes: 1
        run: |
          python scripts/reporting_config.py

          python - <<'PY'
          import os
          from datetime import datetime, timezone

          from bikewatch.ingestion.collect import load_station_ids
          from reporting_config import load_reporting_config, utc_boundary

          tracked = load_station_ids()
          config = load_reporting_config("config/bikewatch_reporting_vars.yml")

          if os.environ["GITHUB_EVENT_NAME"] == "schedule":
              now = datetime.now(timezone.utc)

              active = {
                  period["station_id"]
                  for period in config.get("coverage_tracking_periods", [])
                  if utc_boundary(period["start_bucket"]) <= now
                  and (
                      period.get("end_bucket") is None
                      or now < utc_boundary(period["end_bucket"])
                  )
              }

              if active != tracked:
                  raise SystemExit(
                      "Active coverage periods must match tracked stations "
                      "before scheduled collection."
                  )

          print(f"Validated {len(tracked)} tracked stations.")
          PY

            - name: Diagnose ingestion database connection
        timeout-minutes: 2
        env:
          BIKEWATCH_DATABASE_URL: ${{ secrets.BIKEWATCH_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os

          import psycopg

          dsn = os.environ.get("BIKEWATCH_DATABASE_URL", "")

          if not dsn.strip():
              raise SystemExit("BIKEWATCH_DATABASE_URL is missing or empty.")

          def probe(label, **kwargs):
              try:
                  with psycopg.connect(
                      dsn,
                      autocommit=True,
                      connect_timeout=15,
                      **kwargs,
                  ) as db:
                      db.execute("SELECT 1").fetchone()
              except psycopg.Error as exc:
                  # Inspect internally; never print the raw exception or DSN.
                  message = str(exc).lower()

                  if "unsupported startup parameter" in message:
                      reason = "unsupported startup parameter"
                  elif "password authentication failed" in message:
                      reason = "password authentication failed"
                  elif "could not translate host name" in message:
                      reason = "hostname resolution failed"
                  elif "timeout" in message or "timed out" in message:
                      reason = "connection or query timed out"
                  elif "ssl" in message or "certificate" in message:
                      reason = "SSL or certificate error"
                  elif "connection refused" in message:
                      reason = "connection refused"
                  else:
                      reason = "unclassified database error"

                  print(f"{label}: FAIL — {reason}", flush=True)
                  return False

              print(f"{label}: PASS", flush=True)
              return True

          if probe("Current workflow settings"):
              raise SystemExit(0)

          if probe("Without startup options", options=""):
              raise SystemExit(
                  "Connection succeeded without startup options. "
                  "Check PGOPTIONS and any options in the connection URL."
              )

          raise SystemExit("Both connection checks failed.")
          PY
          
        - name: Diagnose ingestion database connection
        timeout-minutes: 2
        env:
          BIKEWATCH_DATABASE_URL: ${{ secrets.BIKEWATCH_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os

          import psycopg

          dsn = os.environ.get("BIKEWATCH_DATABASE_URL", "")

          if not dsn.strip():
              raise SystemExit("BIKEWATCH_DATABASE_URL is missing or empty.")

          def probe(label, **kwargs):
              try:
                  with psycopg.connect(
                      dsn,
                      autocommit=True,
                      connect_timeout=15,
                      **kwargs,
                  ) as db:
                      db.execute("SELECT 1").fetchone()
              except psycopg.Error as exc:
                  # Inspect internally; never print the raw exception or DSN.
                  message = str(exc).lower()

                  if "unsupported startup parameter" in message:
                      reason = "unsupported startup parameter"
                  elif "password authentication failed" in message:
                      reason = "password authentication failed"
                  elif "could not translate host name" in message:
                      reason = "hostname resolution failed"
                  elif "timeout" in message or "timed out" in message:
                      reason = "connection or query timed out"
                  elif "ssl" in message or "certificate" in message:
                      reason = "SSL or certificate error"
                  elif "connection refused" in message:
                      reason = "connection refused"
                  else:
                      reason = "unclassified database error"

                  print(f"{label}: FAIL — {reason}", flush=True)
                  return False

              print(f"{label}: PASS", flush=True)
              return True

          if probe("Current workflow settings"):
              raise SystemExit(0)

          if probe("Without startup options", options=""):
              raise SystemExit(
                  "Connection succeeded without startup options. "
                  "Check PGOPTIONS and any options in the connection URL."
              )

          raise SystemExit("Both connection checks failed.")
          PY

      - name: Collect live observations
        timeout-minutes: 3
        env:
          BIKEWATCH_DATABASE_URL: ${{ secrets.BIKEWATCH_DATABASE_URL }}
        run: python -m bikewatch.ingestion.collect

      - name: Validate and publish reporting
        timeout-minutes: 6
        env:
          DBT_HOST: ${{ vars.DBT_HOST }}
          DBT_PORT: ${{ vars.DBT_PORT || '5432' }}
          DBT_DBNAME: ${{ vars.DBT_DBNAME || 'bikewatch' }}
          DBT_ENV_SECRET_PASSWORD: ${{ secrets.DBT_ENV_SECRET_PASSWORD }}
        run: python scripts/publish_reporting.py

      - name: Save diagnostics after failure
        if: ${{ failure() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-failure-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .bikewatch-publication/*/target/run_results.json
            .bikewatch-publication/*/target/sources.json
            .bikewatch-publication/*/reporting_vars.json
          retention-days: 7
          if-no-files-found: ignore